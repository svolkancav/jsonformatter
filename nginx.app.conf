# nginx config for the jsonformatter_app container (serves the built SPA +
# prerendered per-route pages). Copied to /etc/nginx/conf.d/default.conf by the
# Dockerfile, replacing the stock nginx default.
#
# Goal: a request like /json-to-toon must serve the prerendered
# /json-to-toon/index.html directly (HTTP 200, no redirect) so Google sees the
# unique per-route <title>/meta. Unknown routes fall back to the SPA shell.

# Without an explicit Cache-Control, browsers cache HTML heuristically — and a
# stale index.html names hashed asset files that are cached for a year, so one
# stale document pins a returning visitor to an entire old build. That is how
# visitors kept running the pre-migration bundle (and writing to Supabase)
# after the app had already been redeployed. HTML must revalidate every time;
# its ETag keeps that a cheap 304.
map $sent_http_content_type $jf_cache_control {
    default       "public, max-age=3600";
    ~*^text/html  "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $jf_cache_control always;

    # Root -> homepage shell.
    location = / {
        try_files /index.html =404;
    }

    # /json-to-toon -> /json-to-toon/index.html (200, no redirect).
    # Anything unresolved -> /index.html so the client router can handle it.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # A path that names a file is not a client-side route. Without this, a
    # missing one falls through to the SPA shell and answers 200 with HTML —
    # which is why a mistyped sitemap URL came back as a page instead of
    # failing, and what Search Console reports as "your sitemap appears to be
    # an HTML page". Let those 404 honestly; it also keeps Google from
    # indexing soft 404s for any wrong asset URL.
    location ~* \.(html?|xml|txt|json|webmanifest|ico|png|jpe?g|gif|svg|webp|css|js|map|pdf|zip)$ {
        try_files $uri =404;
    }

    # The service worker is the lever that un-sticks an already-stale browser,
    # so it must never be served from cache itself.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets are immutable; cache them hard. The `^~` keeps this
    # winning over the static-file regex below, which would otherwise take
    # these requests and drop the caching headers.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
